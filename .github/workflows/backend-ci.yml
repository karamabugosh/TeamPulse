# Backend CI v3 — generate, nest build, unit tests, then integration tests
# against an ephemeral GitHub Actions PostgreSQL service (never teampulse).
# Does not run Prisma migrate deploy, Playwright, or live Slack/OpenAI/Jira.
name: Backend CI

on:
  push:
  pull_request:

# CI-only Postgres credentials. The service container is created for this job
# and destroyed when the job ends. It is not the developer machine database.
env:
  POSTGRES_DB: pulse_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulse_test?schema=public
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/pulse_test?schema=public

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Build, unit, and integration tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # Generate @prisma/client without requiring a live query (schema env only).
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Run unit tests
        run: npm test

      # Extra wait: service healthcheck already gated job start; this confirms
      # TCP + SQL before db push / integration tests.
      - name: Wait for PostgreSQL
        run: |
          node -e "
          const net = require('net');
          const tryConnect = () => new Promise((resolve, reject) => {
            const s = net.connect(5432, 'localhost', () => { s.end(); resolve(); });
            s.on('error', reject);
          });
          (async () => {
            for (let i = 0; i < 30; i++) {
              try {
                await tryConnect();
                console.log('PostgreSQL is accepting connections on localhost:5432');
                process.exit(0);
              } catch {
                await new Promise((r) => setTimeout(r, 2000));
              }
            }
            console.error('PostgreSQL did not become ready');
            process.exit(1);
          })();
          "

      # Apply current schema to the CI database only. Not migrate deploy.
      - name: Push Prisma schema to CI database
        run: npx prisma db push --skip-generate

      - name: Run integration tests
        run: npm run test:integration

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/coverage
          if-no-files-found: error
          retention-days: 14
