# Backend CI v5 — quality gates, tests, then Playwright (existing screenshot helper).
# Does not run Prisma migrate deploy or live Slack/OpenAI/Jira.
name: Backend CI

on:
  push:
  pull_request:

# CI-only Postgres credentials. The service container is created for this job
# and destroyed when the job ends. It is not the developer machine database.
env:
  POSTGRES_DB: pulse_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulse_test?schema=public
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/pulse_test?schema=public

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Quality gates, tests, and Playwright
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      # Generate @prisma/client without requiring a live query (schema env only).
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Report HIGH/CRITICAL findings. Do not fail the job (no auto-upgrade).
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build backend
        run: npm run build

      - name: Run unit tests
        run: npm test

      # Extra wait: service healthcheck already gated job start; this confirms
      # TCP + SQL before db push / integration tests.
      - name: Wait for PostgreSQL
        run: |
          node -e "
          const net = require('net');
          const tryConnect = () => new Promise((resolve, reject) => {
            const s = net.connect(5432, 'localhost', () => { s.end(); resolve(); });
            s.on('error', reject);
          });
          (async () => {
            for (let i = 0; i < 30; i++) {
              try {
                await tryConnect();
                console.log('PostgreSQL is accepting connections on localhost:5432');
                process.exit(0);
              } catch {
                await new Promise((r) => setTimeout(r, 2000));
              }
            }
            console.error('PostgreSQL did not become ready');
            process.exit(1);
          })();
          "

      # Apply current schema to the CI database only. Not migrate deploy.
      - name: Push Prisma schema to CI database
        run: npx prisma db push --skip-generate

      - name: Run integration tests
        run: npm run test:integration

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Existing Playwright usage is docs/capture-screenshots.mjs (no playwright.config).
      - name: Install Playwright and browsers
        working-directory: docs
        run: |
          npm install playwright
          npx playwright install --with-deps

      - name: Verify Chromium is available
        working-directory: docs
        run: |
          node --input-type=module -e "
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          console.log('Chromium launch OK');
          await browser.close();
          "

      # Start apps and run Playwright in the same step so background servers
      # are not reaped between GitHub Actions steps.
      - name: Start application and run Playwright tests
        working-directory: ${{ github.workspace }}
        env:
          PULSE_URL: http://127.0.0.1:5173
          PORT: "3000"
          SLACK_SOCKET_MODE_ENABLED: "false"
          CHECKIN_SCHEDULER_ENABLED: "false"
          DIGEST_SCHEDULER_ENABLED: "false"
        run: |
          set -euo pipefail

          echo "Building frontend for vite preview..."
          (cd frontend && npm run build)

          echo "Starting backend and frontend..."
          (cd backend && node dist/main.js > /tmp/pulse-backend.log 2>&1) &
          BACKEND_PID=$!
          (cd frontend && npx vite preview --host 127.0.0.1 --port 5173 --strictPort > /tmp/pulse-frontend.log 2>&1) &
          FRONTEND_PID=$!

          node -e "
          const http = require('http');
          const net = require('net');

          const ping = (url) => new Promise((resolve, reject) => {
            const req = http.get(url, (res) => {
              res.resume();
              if (res.statusCode && res.statusCode >= 200 && res.statusCode < 500) {
                resolve(res.statusCode);
                return;
              }
              reject(new Error('HTTP ' + res.statusCode + ' for ' + url));
            });
            req.on('error', reject);
            req.setTimeout(5000, () => {
              req.destroy();
              reject(new Error('timeout for ' + url));
            });
          });

          const portOpen = (port) => new Promise((resolve) => {
            const socket = net.connect(port, '127.0.0.1', () => {
              socket.end();
              resolve(true);
            });
            socket.on('error', () => resolve(false));
            socket.setTimeout(2000, () => {
              socket.destroy();
              resolve(false);
            });
          });

          const alive = (pid) => {
            try {
              process.kill(pid, 0);
              return true;
            } catch {
              return false;
            }
          };

          (async () => {
            let frontendReady = false;
            let backendReady = false;

            for (let attempt = 1; attempt <= 60; attempt++) {
              if (!alive(${BACKEND_PID})) {
                console.error('Backend process exited before becoming ready');
                process.exit(2);
              }
              if (!alive(${FRONTEND_PID})) {
                console.error('Frontend process exited before becoming ready');
                process.exit(3);
              }

              if (!frontendReady) {
                try {
                  await ping('http://127.0.0.1:5173/');
                  frontendReady = true;
                  console.log('Frontend is ready');
                } catch (err) {
                  console.log('[frontend]', err.message || err);
                }
              }

              if (!backendReady) {
                const tcpReady = await portOpen(3000);
                if (tcpReady) {
                  try {
                    await ping('http://127.0.0.1:3000/api/questions');
                    backendReady = true;
                    console.log('Backend is ready');
                  } catch (err) {
                    console.log('[backend]', err.message || err);
                  }
                } else {
                  console.log('[backend] waiting for port 3000');
                }
              }

              if (frontendReady && backendReady) {
                console.log('Frontend and backend are ready');
                process.exit(0);
              }

              await new Promise((resolve) => setTimeout(resolve, 2000));
            }

            console.error('Application did not become ready');
            process.exit(1);
          })();
          " || {
            echo '--- frontend log ---'
            cat /tmp/pulse-frontend.log || true
            echo '--- backend log ---'
            cat /tmp/pulse-backend.log || true
            kill "$FRONTEND_PID" "$BACKEND_PID" 2>/dev/null || true
            exit 1
          }

          # CI-only workaround: empty CheckIns page exposes two \"New CheckIn\" buttons.
          node <<'PATCH'
          const fs = require('fs');
          const file = 'docs/capture-screenshots.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const needle = ".getByRole('button', { name: /New CheckIn|Create CheckIn/i }).click()";
          const patch = ".getByRole('button', { name: /New CheckIn|Create CheckIn/i }).first().click()";
          if (source.includes(needle)) {
            fs.writeFileSync(file, source.replace(needle, patch));
            console.log('Applied CI-only strict-mode patch for New CheckIn button');
          }
          PATCH

          rm -f docs/screenshots/0*.png docs/screenshots/06-checkin-create-dialog.png

          cd docs
          node capture-screenshots.mjs

          kill "$FRONTEND_PID" "$BACKEND_PID" 2>/dev/null || true

      - name: Run unit tests with coverage
        if: success()
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            docs/screenshots/**
            docs/playwright-report/**
            docs/test-results/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14
