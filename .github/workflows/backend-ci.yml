# Backend CI v5 — quality gates, tests, then Playwright (existing screenshot helper).
# Does not run Prisma migrate deploy or live Slack/OpenAI/Jira.
name: Backend CI

on:
  push:
  pull_request:

# CI-only Postgres credentials. The service container is created for this job
# and destroyed when the job ends. It is not the developer machine database.
env:
  POSTGRES_DB: pulse_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulse_test?schema=public
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/pulse_test?schema=public

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Quality gates, tests, and Playwright
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      # Generate @prisma/client without requiring a live query (schema env only).
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Report HIGH/CRITICAL findings. Do not fail the job (no auto-upgrade).
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build backend
        run: npm run build

      - name: Run unit tests
        run: npm test

      # Extra wait: service healthcheck already gated job start; this confirms
      # TCP + SQL before db push / integration tests.
      - name: Wait for PostgreSQL
        run: |
          node -e "
          const net = require('net');
          const tryConnect = () => new Promise((resolve, reject) => {
            const s = net.connect(5432, 'localhost', () => { s.end(); resolve(); });
            s.on('error', reject);
          });
          (async () => {
            for (let i = 0; i < 30; i++) {
              try {
                await tryConnect();
                console.log('PostgreSQL is accepting connections on localhost:5432');
                process.exit(0);
              } catch {
                await new Promise((r) => setTimeout(r, 2000));
              }
            }
            console.error('PostgreSQL did not become ready');
            process.exit(1);
          })();
          "

      # Apply current schema to the CI database only. Not migrate deploy.
      - name: Push Prisma schema to CI database
        run: npx prisma db push --skip-generate

      - name: Run integration tests
        run: npm run test:integration

      # Screenshot script expects a workspace/team (placeholder Slack, no live APIs).
      # Not seed:demo (that path requires live Jira).
      - name: Seed CI database for Playwright
        run: npx prisma db seed

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Existing Playwright usage is docs/capture-screenshots.mjs (no playwright.config).
      - name: Install Playwright and browsers
        working-directory: docs
        run: |
          npm install playwright
          npx playwright install --with-deps

      - name: Verify Chromium is available
        working-directory: docs
        run: |
          node --input-type=module -e "
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          console.log('Chromium launch OK');
          await browser.close();
          "

      - name: Verify backend build output
        working-directory: backend
        run: test -f dist/main.js

      # Start apps and run Playwright in the same step so background servers
      # are not reaped between GitHub Actions steps.
      - name: Start application and run Playwright tests
        working-directory: ${{ github.workspace }}
        env:
          PULSE_URL: http://127.0.0.1:5173
          PORT: "3000"
          SLACK_SOCKET_MODE_ENABLED: "false"
          CHECKIN_SCHEDULER_ENABLED: "false"
          DIGEST_SCHEDULER_ENABLED: "false"
        run: |
          set -e

          wait_http() {
            url="$1"
            name="$2"
            log="$3"
            for attempt in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "$url" || true)
              code=$(printf '%s' "$code" | tr -cd '0-9' | tail -c 3)
              echo "Waiting for ${name} (attempt ${attempt}): HTTP ${code}"
              if printf '%s' "$code" | grep -qE '^[2345][0-9][0-9]$'; then
                echo "${name} is ready"
                return 0
              fi
              if [ "$attempt" -eq 10 ] || [ "$attempt" -eq 20 ]; then
                echo "--- ${log} (partial) ---"
                tail -n 40 "$log" || true
              fi
              sleep 2
            done
            echo "${name} did not become ready"
            echo "--- ${log} ---"
            cat "$log" || true
            return 1
          }

          cd "${GITHUB_WORKSPACE}"

          # Point Vite's /api proxy at IPv4 so it matches Nest bound to 0.0.0.0
          # (localhost can resolve to ::1 on ubuntu-latest).
          python3 - <<'PY'
          from pathlib import Path
          path = Path("frontend/vite.config.ts")
          path.write_text(path.read_text().replace("http://localhost:3000", "http://127.0.0.1:3000"))
          print("Vite API proxy -> http://127.0.0.1:3000")
          PY

          cd "${GITHUB_WORKSPACE}/backend"
          node dist/main.js > /tmp/pulse-backend.log 2>&1 &
          echo "Backend PID $!"

          cd "${GITHUB_WORKSPACE}/frontend"
          npx vite --host 127.0.0.1 --port 5173 --strictPort --clearScreen false > /tmp/pulse-frontend.log 2>&1 &
          echo "Frontend PID $!"

          cd "${GITHUB_WORKSPACE}"

          wait_http "http://127.0.0.1:5173/" "frontend" /tmp/pulse-frontend.log
          wait_http "http://127.0.0.1:3000/api/questions" "backend" /tmp/pulse-backend.log
          wait_http "http://127.0.0.1:3000/api/admin/workspaces" "workspaces API" /tmp/pulse-backend.log

          rm -f docs/screenshots/0*.png docs/screenshots/06-checkin-create-dialog.png docs/screenshots/99-playwright-failure.*

          cd docs
          set +e
          node capture-screenshots.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "--- frontend log ---"
            tail -n 80 /tmp/pulse-frontend.log || true
            echo "--- backend log ---"
            tail -n 80 /tmp/pulse-backend.log || true
            exit "$status"
          fi

      - name: Run unit tests with coverage
        if: success()
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            docs/screenshots/**
            docs/playwright-report/**
            docs/test-results/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14
