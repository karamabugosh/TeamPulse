# Backend CI — quality gates, tests, then Playwright (@playwright/test).
# Does not run Prisma migrate deploy or live Slack/OpenAI/Jira.
name: Backend CI

on:
  push:
  pull_request:

# CI-only Postgres credentials. The service container is created for this job
# and destroyed when the job ends. It is not the developer machine database.
env:
  POSTGRES_DB: pulse_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulse_test?schema=public
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/pulse_test?schema=public

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Quality gates, tests, and Playwright
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      # Generate @prisma/client without requiring a live query (schema env only).
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Report HIGH/CRITICAL findings. Do not fail the job (no auto-upgrade).
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build backend
        run: npm run build

      - name: Run unit tests
        run: npm test

      # Extra wait: service healthcheck already gated job start; this confirms
      # TCP + SQL before db push / integration tests.
      - name: Wait for PostgreSQL
        run: |
          node -e "
          const net = require('net');
          const tryConnect = () => new Promise((resolve, reject) => {
            const s = net.connect(5432, 'localhost', () => { s.end(); resolve(); });
            s.on('error', reject);
          });
          (async () => {
            for (let i = 0; i < 30; i++) {
              try {
                await tryConnect();
                console.log('PostgreSQL is accepting connections on localhost:5432');
                process.exit(0);
              } catch {
                await new Promise((r) => setTimeout(r, 2000));
              }
            }
            console.error('PostgreSQL did not become ready');
            process.exit(1);
          })();
          "

      # Apply current schema to the CI database only. Not migrate deploy.
      - name: Push Prisma schema to CI database
        run: npx prisma db push --skip-generate

      - name: Run integration tests
        run: npm run test:integration

      - name: Build Docker Compose images
        working-directory: ${{ github.workspace }}
        run: |
          docker compose version
          docker compose build

      - name: Start Docker Compose
        working-directory: ${{ github.workspace }}
        env:
          POSTGRES_PORT: "5433"
        run: docker compose up -d

      - name: Wait for Docker services
        working-directory: ${{ github.workspace }}
        env:
          POSTGRES_PORT: "5433"
        run: |
          set -e
          wait_http() {
            url="$1"
            name="$2"
            for attempt in $(seq 1 45); do
              exited="$(docker compose ps -a --status exited -q || true)"
              if [ -n "$exited" ]; then
                echo "A Compose container exited unexpectedly"
                docker compose ps -a
                docker compose logs --tail 80
                exit 1
              fi
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "$url" || true)
              code=$(printf '%s' "$code" | tr -cd '0-9' | tail -c 3)
              echo "Waiting for ${name} (attempt ${attempt}): HTTP ${code}"
              if printf '%s' "$code" | grep -qE '^[23][0-9][0-9]$'; then
                echo "${name} is ready"
                return 0
              fi
              sleep 2
            done
            echo "${name} did not become ready"
            docker compose ps -a
            docker compose logs --tail 80
            return 1
          }

          wait_http "http://127.0.0.1:3000/api/questions" "backend"
          wait_http "http://127.0.0.1:5173/" "frontend"

          echo "Compose status:"
          docker compose ps
          docker compose exec -T postgres pg_isready -U postgres -d pulse

      - name: Stop Docker Compose
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          POSTGRES_PORT: "5433"
        run: docker compose down -v

      # Placeholder Slack workspace/team for dashboard smoke tests. Not seed:demo.
      - name: Seed CI database for Playwright
        run: npx prisma db seed

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Verify backend build output
        working-directory: backend
        run: test -f dist/main.js

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: "true"
          PULSE_URL: http://127.0.0.1:5173
          PULSE_API_URL: http://127.0.0.1:3000
          PORT: "3000"
          SLACK_SOCKET_MODE_ENABLED: "false"
          CHECKIN_SCHEDULER_ENABLED: "false"
          DIGEST_SCHEDULER_ENABLED: "false"
        run: npm run test:e2e

      - name: Run unit tests with coverage
        if: success()
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
          if-no-files-found: warn
          retention-days: 14
