# Backend CI v5 — quality gates, tests, then Playwright (existing screenshot helper).
# Does not run Prisma migrate deploy or live Slack/OpenAI/Jira.
name: Backend CI

on:
  push:
  pull_request:

# CI-only Postgres credentials. The service container is created for this job
# and destroyed when the job ends. It is not the developer machine database.
env:
  POSTGRES_DB: pulse_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulse_test?schema=public
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/pulse_test?schema=public

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Quality gates, tests, and Playwright
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      # Generate @prisma/client without requiring a live query (schema env only).
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Report HIGH/CRITICAL findings. Do not fail the job (no auto-upgrade).
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build backend
        run: npm run build

      - name: Run unit tests
        run: npm test

      # Extra wait: service healthcheck already gated job start; this confirms
      # TCP + SQL before db push / integration tests.
      - name: Wait for PostgreSQL
        run: |
          node -e "
          const net = require('net');
          const tryConnect = () => new Promise((resolve, reject) => {
            const s = net.connect(5432, 'localhost', () => { s.end(); resolve(); });
            s.on('error', reject);
          });
          (async () => {
            for (let i = 0; i < 30; i++) {
              try {
                await tryConnect();
                console.log('PostgreSQL is accepting connections on localhost:5432');
                process.exit(0);
              } catch {
                await new Promise((r) => setTimeout(r, 2000));
              }
            }
            console.error('PostgreSQL did not become ready');
            process.exit(1);
          })();
          "

      # Apply current schema to the CI database only. Not migrate deploy.
      - name: Push Prisma schema to CI database
        run: npx prisma db push --skip-generate

      - name: Run integration tests
        run: npm run test:integration

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Existing Playwright usage is docs/capture-screenshots.mjs (no playwright.config).
      - name: Install Playwright browsers
        working-directory: docs
        run: |
          npm install playwright
          npx playwright install --with-deps

      # Start apps and run Playwright in the same step so background servers
      # are not reaped between GitHub Actions steps.
      - name: Start application and run Playwright tests
        working-directory: ${{ github.workspace }}
        env:
          PULSE_URL: http://127.0.0.1:5173
          PORT: "3000"
        run: |
          set -e
          cd frontend
          npm run dev -- --host 0.0.0.0 --port 5173 --strictPort > /tmp/pulse-frontend.log 2>&1 &
          cd ../backend
          node dist/main.js > /tmp/pulse-backend.log 2>&1 &
          cd ..
          node -e "
          const http = require('http');
          const ping = (url) => new Promise((resolve, reject) => {
            const req = http.get(url, (res) => { res.resume(); resolve(res.statusCode); });
            req.on('error', reject);
            req.setTimeout(3000, () => { req.destroy(); reject(new Error('timeout')); });
          });
          (async () => {
            for (let i = 0; i < 45; i++) {
              try {
                await ping('http://127.0.0.1:5173/');
                await ping('http://127.0.0.1:3000/api/questions');
                console.log('Frontend and backend are ready');
                process.exit(0);
              } catch (err) {
                console.log('Waiting for application...', err.message || err);
                await new Promise((r) => setTimeout(r, 2000));
              }
            }
            console.error('Application did not become ready');
            process.exit(1);
          })();
          " || {
            echo '--- frontend log ---'
            cat /tmp/pulse-frontend.log || true
            echo '--- backend log ---'
            cat /tmp/pulse-backend.log || true
            exit 1
          }
          cd docs
          node capture-screenshots.mjs

      - name: Run unit tests with coverage
        if: success()
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            docs/screenshots/**
            docs/playwright-report/**
            docs/test-results/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14
