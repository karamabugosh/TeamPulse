# Backend CI v1 — Jest unit tests only.
# Does not run Build, Prisma migrate, PostgreSQL, integration tests, or Playwright.
name: Backend CI

on:
  push:
  pull_request:

# Dummy URL satisfies `env("DATABASE_URL")` in schema.prisma for `prisma generate`.
# Prisma generate does not open a database connection. Do not use real credentials.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    # All `run:` steps execute in backend/ (NestJS package at the repository root).
    defaults:
      run:
        working-directory: backend

    steps:
      # Clone the commit under test.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 20 matches @types/node ^20. Cache keyed off backend/package-lock.json.
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Reproducible install from the lockfile.
      # postinstall already runs `prisma generate`; the next step makes that explicit.
      - name: Install backend dependencies
        run: npm ci

      # Generate @prisma/client without connecting to PostgreSQL.
      # Required because unit tests import Prisma enums (e.g. MemoryVisibility).
      - name: Generate Prisma Client
        run: npx prisma generate

      # Jest discovers src/**/*.unit.spec.ts only (DigestService + MemoryChunkerService).
      # Legacy ts-node *.spec.ts scripts are excluded and are not run here.
      - name: Run unit tests
        run: npm test

      # Same suite with coverage. No coverageThreshold — this step must not fail
      # on low global % while most of src/ is still untested.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      # Persist coverage/ for download from the Actions run (lcov, json-summary, text).
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/coverage
          if-no-files-found: error
          retention-days: 14
